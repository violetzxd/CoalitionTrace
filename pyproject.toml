[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coalitiontrace"
version = "0.1.0"
description = "Budgeted minimal poison-coalition attribution for RAG"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
gpu = ["torch>=2.5", "transformers>=4.45,<5"]

[tool.setuptools.packages.find]
include = ["coalitiontrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

